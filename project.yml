name: NeuroStudy
options:
  bundleIdPrefix: com.neurostudy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0
    INFOPLIST_KEY_CFBundleDisplayName: NeuroStudy
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  NeuroStudy:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Shared
        type: group
        excludes:
          - "Resources/*.pdf"
          # Internal dev notes. Without this they are copied into the app bundle
          # as resources and ship to users inside the IPA.
          - "**/*.md"
          # The Icon Composer bundle is added below as a single file reference;
          # recursing into it would ship icon.json and the layer PNG as loose files.
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      # Liquid Glass app icon (iOS 26+). actool compiles it and derives the
      # light, dark, tinted, and clear variants. AppIcon.appiconset stays as the
      # fallback for iOS 17-25.
      - path: Shared/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neurostudy.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 47K6N92W54
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  NeuroStudyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeuroStudyUITests
    dependencies:
      - target: NeuroStudy_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neurostudy.app.uitests
        DEVELOPMENT_TEAM: 47K6N92W54
        TEST_TARGET_NAME: NeuroStudy_iOS
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NeuroStudy_iOS:
    build:
      targets:
        NeuroStudy_iOS: all
        NeuroStudyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: NeuroStudyUITests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
